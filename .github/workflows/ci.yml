name: CI Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify commit message format
        run: npx commitlint --last --verbose

      - name: Run Quality Gate Check
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          MQTT_HOST: ${{ vars.MQTT_HOST }}
          MQTT_PORT: ${{ vars.MQTT_PORT }}
          MQTT_PATH: ${{ vars.MQTT_PATH }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          RTSP_PUSH_BASE: ${{ vars.RTSP_PUSH_BASE }}
          HLS_BASE_URL: ${{ vars.HLS_BASE_URL }}
          DEFAULT_BOT_ID: ${{ vars.DEFAULT_BOT_ID }}
        run: npm run check
