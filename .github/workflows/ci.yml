name: CI Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify commit message format (PR)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Verify commit message format (Push)
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Run Quality Gate Check
        env:
          API_URL: ${{ vars.API_URL || 'http://localhost:5000' }}
          HLS_BASE_URL: ${{ vars.HLS_BASE_URL || 'https://media.toolhub.app' }}
          DEFAULT_BOT_ID: ${{ vars.DEFAULT_BOT_ID || 'tjbot1' }}
        run: npm run check
